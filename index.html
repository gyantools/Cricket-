<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CricPulse — real live cricket scores, full scorecards, series and news in 6 languages.">
<meta name="theme-color" content="#0b3160">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%8F%3C/text%3E%3C/svg%3E">
<title>CricPulse — Live Cricket Score</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Bengali', 'Noto Sans Tamil', Arial, sans-serif; }
  :root { --nav:#0b3160; --nav2:#0d3c75; --accent:#0d5ea8; --live:#e63946; --bg:#f4f6f9; --card:#fff; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; --green:#16a34a; }
  body.dark { --bg:#0b1220; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8; --border:#23304d; --nav:#081428; --nav2:#0c1e3c; }
  body { background:var(--bg); color:var(--text); transition:background .3s,color .3s; }

  header { background:linear-gradient(135deg,var(--nav),var(--nav2)); color:#fff; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .hwrap { max-width:1200px; margin:auto; display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .logo { font-size:23px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .logo .ball { width:28px; height:28px; background:radial-gradient(circle at 30% 30%, #ff6b6b, #c1121f 70%); border-radius:50%; position:relative; animation:spin 6s linear infinite; }
  .logo .ball::after { content:''; position:absolute; inset:0; border-radius:50%; border-left:2px solid rgba(255,255,255,.7); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .logo span.red { color:#ff6b6b; }
  .search { flex:1; max-width:380px; margin-left:auto; position:relative; }
  .search input { width:100%; padding:9px 14px 9px 36px; border-radius:20px; border:none; outline:none; background:rgba(255,255,255,.14); color:#fff; font-size:14px; }
  .search input::placeholder { color:rgba(255,255,255,.65); }
  .search::before { content:'🔍'; position:absolute; left:11px; top:9px; font-size:14px; z-index:2; }
  .sres { position:absolute; top:42px; left:0; right:0; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:none; box-shadow:0 10px 30px rgba(0,0,0,.3); max-height:320px; overflow-y:auto; z-index:60; }
  .sres.show { display:block; }
  .sres-item { padding:9px 13px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sres-item:last-child { border-bottom:none; }
  .sres-item:hover { background:var(--bg); }
  .sres-item small { color:var(--muted); margin-left:auto; }
  .langsel { background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:20px; padding:9px 8px; font-size:13.5px; cursor:pointer; outline:none; max-width:128px; }
  .langsel option { color:#1a1a2e; }
  .theme-btn { background:rgba(255,255,255,.14); border:none; color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:16px; flex-shrink:0; }
  nav { background:rgba(0,0,0,.18); }
  .navwrap { max-width:1200px; margin:auto; display:flex; gap:2px; padding:0 10px; overflow-x:auto; }
  .navwrap a { color:#dbe7f5; text-decoration:none; padding:10px 13px; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
  .navwrap a.active, .navwrap a:hover { color:#fff; border-bottom-color:#ff6b6b; }

  .layout { max-width:1200px; margin:auto; display:grid; grid-template-columns:1fr 330px; gap:18px; padding:18px 16px; }
  .layout.wide { grid-template-columns:1fr; }
  .layout.wide aside { display:none; }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

  .tabs { display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:10px 10px 0 0; padding:6px 6px 0; }
  .tab { flex:1; text-align:center; padding:10px; font-weight:700; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  body.dark .tab.active { color:#6cb6ff; border-bottom-color:#6cb6ff; }

  .pgtitle { font-size:22px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pgtitle small { font-size:12px; color:var(--muted); font-weight:600; }

  .match-card { background:var(--card); border:1px solid var(--border); border-top:none; padding:14px 16px; cursor:pointer; transition:.2s; }
  .match-card:last-of-type { border-radius:0 0 10px 10px; }
  .match-card:hover { box-shadow:0 4px 16px rgba(13,94,168,.15); }
  .m-head { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .badge { background:var(--live); color:#fff; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .badge .dot { width:7px; height:7px; background:#fff; border-radius:50%; animation:pulse 1s infinite; }
  @keyframes pulse { 50%{ opacity:.25; } }
  .badge.green { background:var(--green); }
  .badge.gray { background:#8a94a6; }
  .m-teams { display:flex; flex-direction:column; gap:8px; }
  .t-row { display:flex; align-items:center; gap:10px; }
  .t-abbr { min-width:44px; font-size:11px; font-weight:800; color:var(--muted); background:var(--bg); border-radius:6px; padding:4px 6px; text-align:center; }
  .t-name { font-weight:700; flex:1; font-size:15px; }
  .t-score { font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .t-score.dim { color:var(--muted); font-weight:600; font-size:13px; }
  .t-row.batting .t-name::after { content:'•'; color:var(--live); margin-left:6px; animation:pulse 1s infinite; }
  .m-foot { margin-top:10px; padding-top:9px; border-top:1px dashed var(--border); font-size:13px; color:var(--accent); font-weight:600; }
  body.dark .m-foot { color:#6cb6ff; }
  .empty { padding:26px; text-align:center; color:var(--muted); background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; font-size:14px; }
  .refresh-bar { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-bottom:none; border-radius:10px 10px 0 0; padding:8px 14px; font-size:12px; color:var(--muted); }
  .refresh-bar b { color:var(--green); }

  .back { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px; margin-bottom:12px; cursor:pointer; font-weight:700; color:var(--accent); display:inline-block; }
  body.dark .back { color:#6cb6ff; }
  .d-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .d-title { font-size:19px; font-weight:800; margin-bottom:4px; line-height:1.4; }
  .d-sub { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .stats-row { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { flex:1; min-width:110px; background:var(--bg); border-radius:8px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:19px; color:var(--accent); }
  body.dark .stat b { color:#6cb6ff; }
  .stat span { font-size:11px; color:var(--muted); }
  .status-line { background:rgba(22,163,74,.1); border-left:4px solid var(--green); padding:10px 14px; border-radius:6px; font-size:14px; font-weight:600; margin-top:10px; }
  .section-h { font-weight:800; font-size:14px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); }
  body.dark .section-h { color:#6cb6ff; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:600; }

  .side-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .side-h { font-weight:800; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .side-h a { font-size:12px; color:var(--accent); text-decoration:none; font-weight:600; cursor:pointer; white-space:nowrap; }
  body.dark .side-h a { color:#6cb6ff; }
  .mini-match { padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; }
  .mini-match:last-child { border-bottom:none; }
  .mini-match b { display:block; margin-bottom:3px; }
  .mini-match small { color:var(--muted); }
  .news-item { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .news-item:last-child { border-bottom:none; }
  .news-thumb { width:64px; height:48px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:linear-gradient(135deg,#1c78d2,#0b3160); }
  .news-item h4 { font-size:12.5px; line-height:1.45; font-weight:600; }
  .news-item small { color:var(--muted); font-size:11px; }

  .cards2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
  .p-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .p-card h3 { font-size:15.5px; font-weight:800; margin-bottom:8px; line-height:1.5; }
  .p-card p { font-size:13px; color:var(--muted); line-height:1.6; }
  .news-big { display:flex; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; cursor:pointer; transition:.2s; }
  .news-big:hover { box-shadow:0 4px 16px rgba(13,94,168,.15); }
  .news-big .news-thumb { width:100px; height:76px; font-size:30px; }
  .news-big h3 { font-size:15px; font-weight:700; line-height:1.45; margin-bottom:6px; }
  .news-big p { font-size:13px; color:var(--muted); line-height:1.5; }
  .news-big .meta { font-size:11.5px; color:var(--accent); font-weight:600; margin-top:6px; }
  body.dark .news-big .meta { color:#6cb6ff; }
  .src-badge { display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); padding:5px 11px; border-radius:8px; font-size:12px; font-weight:700; color:var(--muted); }
  .err-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:30px 20px; text-align:center; }
  .err-box h3 { margin-bottom:8px; font-size:16px; }
  .err-box p { color:var(--muted); font-size:13.5px; line-height:1.6; }
  .spin { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; margin:0 auto 12px; }
  @keyframes rot { to { transform:rotate(360deg); } }
  footer { background:var(--nav); color:#9fb6d4; margin-top:26px; padding:22px 16px; text-align:center; font-size:13px; line-height:1.8; }
  /* ===== v2 additions (static GitHub Pages build) ===== */
  .t-logo { width:22px; height:22px; object-fit:contain; border-radius:4px; background:#fff; flex-shrink:0; }
  .t-row.winner .t-name { color:var(--green); }
  .t-score { text-align:right; }
  .m-venue { font-size:12px; color:var(--muted); margin-top:6px; }
  .sc-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  .sc-tab { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text); }
  .sc-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; }
  table.sc { width:100%; border-collapse:collapse; font-size:13px; min-width:460px; }
  table.sc th { background:var(--bg); color:var(--muted); font-weight:700; font-size:11.5px; text-transform:uppercase; padding:8px 8px; text-align:right; white-space:nowrap; }
  table.sc th:first-child, table.sc td:first-child { text-align:left; }
  table.sc td { padding:8px 8px; border-top:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums; }
  table.sc td .dis { display:block; font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px; }
  table.sc td b.live { color:var(--live); }
  table.sc tr.tot td { font-weight:800; background:var(--bg); }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin-top:8px; }
  .kv div { background:var(--bg); border-radius:8px; padding:9px 11px; font-size:13px; line-height:1.5; }
  .kv div span { display:block; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
  .news-thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
  .news-thumb { overflow:hidden; }
  a.news-big, a.news-item { text-decoration:none; color:inherit; }
  .src-pill { display:inline-block; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:8px; background:var(--bg); border:1px solid var(--border); margin-left:4px; }
  .p-card.click { cursor:pointer; transition:.2s; }
  .p-card.click:hover { box-shadow:0 4px 16px rgba(13,94,168,.15); }
  .ext-link { display:inline-block; margin-top:12px; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none; }
  body.dark .ext-link { color:#6cb6ff; }
  .small-muted { font-size:12px; color:var(--muted); }
  .offline-bar { background:#fff4e5; color:#8a4b00; border:1px solid #ffd8a8; border-radius:10px; padding:8px 12px; font-size:12.5px; margin-bottom:10px; }
  body.dark .offline-bar { background:#3a2a10; color:#ffd8a8; border-color:#6b4a14; }
  @media (max-width:600px){
    .hwrap { flex-wrap:wrap; }
    .search { order:5; max-width:none; flex-basis:100%; margin-left:0; }
    .logo { font-size:20px; margin-right:auto; }
    .news-big .news-thumb { width:84px; height:64px; }
  }
  /* ===== mobile overflow fix ===== */
  html, body { max-width:100%; overflow-x:hidden; }
  .layout { grid-template-columns:minmax(0,1fr) 330px; }
  .layout.wide { grid-template-columns:minmax(0,1fr); }
  @media (max-width:900px){ .layout, .layout.wide { grid-template-columns:minmax(0,1fr); } }
  .layout > main, .layout > aside, .d-card, .p-card, .match-card, .side-card { min-width:0; max-width:100%; }
  .tbl-wrap { max-width:100%; }
  .t-name { min-width:0; overflow-wrap:anywhere; }
  .t-score { overflow-wrap:anywhere; }
  .d-title, .d-sub, .status-line, .m-head span, .kv div, .news-big h3, .news-big p { overflow-wrap:anywhere; }
  img { max-width:100%; }
  @media (max-width:600px){
    .layout { padding:12px 10px; gap:12px; }
    .d-card { padding:12px; }
    .t-row { flex-wrap:wrap; gap:6px 8px; }
    .t-row .t-score { flex-basis:100%; text-align:left; padding-left:30px; font-size:14px; }
    .m-teams .t-row .t-score { flex-basis:auto; text-align:right; padding-left:0; }
    table.sc { min-width:0; font-size:12px; }
    table.sc th, table.sc td { padding:7px 5px; }
    table.sc td:first-child { min-width:110px; }
    .stat { min-width:calc(50% - 6px); }
    .stat b { font-size:17px; }
    .sc-tab { padding:6px 10px; font-size:12px; }
    .d-title { font-size:17px; }
  }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo" onclick="go('matches')"><span class="ball"></span>Cric<span class="red">Pulse</span></div>
    <div class="search">
      <input id="searchBox" autocomplete="off">
      <div class="sres" id="sres"></div>
    </div>
    <select class="langsel" id="langSel" onchange="setLang(this.value)" title="Language"></select>
    <button class="theme-btn" onclick="toggleTheme()" title="Dark/Light">🌙</button>
  </div>
  <nav><div class="navwrap">
    <a data-route="home"   onclick="go('matches')"></a>
    <a data-route="live"   onclick="go('matches')"></a>
    <a data-route="news"   onclick="go('news')"></a>
    <a data-route="series" onclick="go('series')"></a>
    <a data-route="about"  onclick="go('about')"></a>
  </div></nav>
</header>

<div class="layout" id="layout">
  <main id="main"></main>
  <aside id="aside"></aside>
</div>

<footer>
  <div>⚡ <b>CricPulse</b> — <span data-i18n="foot1"></span></div>
  <div style="font-size:12px;opacity:.85"><span data-i18n="foot2"></span></div>
</footer>

/* ============================================================
   REAL DATA — loaded DIRECTLY in the browser (works on GitHub Pages)
   Source: ESPN / Cricinfo public scoreboard API (CORS enabled)
   News  : ESPNcricinfo (ESPN API) + BBC Sport RSS (via rss2json)
============================================================ */
const ESPN_HOSTS = ['https://site.web.api.espn.com', 'https://site.api.espn.com'];
const NEWS_LEAGUE = '8676';            // any cricket league id returns the global cricket news list
const BBC_RSS = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/sport/cricket/rss.xml');

let DATA = null;      // {live, upcoming, recent, ts}
let NEWS = null;      // {items}
let POOL = {};        // id -> match (merged from several days)
let DETAIL = {};      // id -> {sum, ts, err}
let state = { view:'matches', tab:'live', param:null, lastFetch:null, inn:{}, offline:false, tabAuto:true };

async function getJSON(url, timeout){
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const tm = setTimeout(()=>{ try{ ctrl && ctrl.abort(); }catch(e){} }, timeout||12000);
  try{
    const r = await fetch(url, ctrl? {signal:ctrl.signal} : undefined);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
async function espn(path){
  let last;
  for(const h of ESPN_HOSTS){
    try { return await getJSON(h+path); } catch(e){ last = e; }
  }
  throw last || new Error('espn failed');
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const _ta = document.createElement('textarea');
function dec(s){ _ta.innerHTML = String(s==null?'':s); return _ta.value; }            // decode &amp; &dagger; …
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function strip(s){ return dec(String(s||'').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim(); }
function ymd(off){ const d=new Date(Date.now()+off*86400000); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function locale(){ return lang==='en' ? 'en-IN' : lang; }
function startStr(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  try { return d.toLocaleString(locale(), {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return d.toString().slice(0,21); }
}
function agoStr(ts){
  const n = Math.max(0, Math.round((Date.now()-ts)/1000));
  return n<5 ? t('justNow') : tf('secAgo',{n});
}
function statMap(stats){ const o={}; (stats||[]).forEach(s=>{ o[s.name]= (s.displayValue!==undefined? s.displayValue : s.value); }); return o; }

/* ---------- normalise one ESPN event ---------- */
function normEvent(e, lg){
  const c = (e.competitions||[])[0]; if(!c) return null;
  const type = ((e.status||{}).type) || ((c.status||{}).type) || {};
  const summary = dec((c.status||{}).summary || (e.status||{}).summary || '');
  const comps = (c.competitors||[]).slice().sort((a,b)=>(+a.order||0)-(+b.order||0));
  if(comps.length<2) return null;
  const team = x => {
    const tm = x.team||{};
    const inns = (x.linescores||[]).filter(l=>l.isBatting && (l.runs || l.wickets || +l.overs || l.isCurrent))
      .map(l=>({period:l.period, runs:l.runs||0, wkts:l.wickets||0, overs:l.overs, cur:!!l.isCurrent}));
    return { id:String(x.id||tm.id||''), name:dec(tm.displayName||tm.name||x.displayName||'?'), abr:dec(tm.abbreviation||x.abbreviation||''),
             logo: tm.logo || '', score: dec(x.score||''), winner: x.winner===true || x.winner==='true', inns };
  };
  const t1 = team(comps[0]), t2 = team(comps[1]);
  const st = type.state || 'pre';
  const hasScore = !!(t1.score || t2.score);
  let tab = 'upcoming';
  if(st==='post') tab='recent';
  else if(st==='in') tab = (!hasScore && /^starts|^match yet|^scheduled/i.test(summary)) ? 'upcoming' : 'live';
  const cls = c.class || {};
  return {
    id: String(e.id), league: String(lg.id||((e.season||{}).type)||''), tab, live: tab==='live',
    t1, t2, series: dec(lg.name||lg.abbreviation||''), seriesDetail: dec(e.description||c.description||''),
    round: dec(c.description||''), type: dec(cls.eventType || cls.generalClassCard || ''),
    statusText: summary, statusLabel: dec(type.description || type.detail || ''),
    start: e.date || c.date, end: e.endDate || c.endDate,
    venue: dec(((c.venue||{}).fullName)||''), tv: [],
    intl: String(cls.internationalClassId||'0')!=='0',
    link: ((e.links||[]).find(l=>(l.rel||[]).includes('summary'))||{}).href || ''
  };
}
function parsePanel(j){
  const out = [];
  (j && j.scores || []).forEach(s=>{
    const lg = (s.leagues||[])[0] || {};
    (s.events||[]).forEach(e=>{ try{ const m = normEvent(e, lg); if(m) out.push(m); }catch(err){} });
  });
  return out;
}
function rebuild(){
  const all = Object.values(POOL);
  const by = (a,b)=> new Date(a.start) - new Date(b.start);
  const pri = m => (/india/i.test(m.t1.name+' '+m.t2.name) ? 0 : 2) + (m.intl ? 0 : 1) + (/women/i.test(m.t1.name) ? 0.5 : 0);
  const live = all.filter(m=>m.tab==='live').sort((a,b)=> (pri(a)-pri(b)) || by(a,b));
  const upcoming = all.filter(m=>m.tab==='upcoming').sort(by);
  const recent = all.filter(m=>m.tab==='recent').sort((a,b)=>by(b,a)).slice(0,40);
  DATA = { live, upcoming, recent, ts: Date.now() };
  if(state.tabAuto){
    state.tab = live.length ? 'live' : (recent.length ? 'recent' : 'upcoming');
  }
}

let fullLoaded = false, loading = false;
async function loadMatches(force){
  if(loading) return; loading = true;
  try{
    const jobs = [ espn('/apis/site/v2/sports/cricket/scorepanel') ];
    if(!fullLoaded || force===true){
      jobs.push(espn('/apis/site/v2/sports/cricket/scorepanel?dates='+ymd(-1)));
      jobs.push(espn('/apis/site/v2/sports/cricket/scorepanel?dates='+ymd(1)));
      jobs.push(espn('/apis/site/v2/sports/cricket/scorepanel?dates='+ymd(2)));
    }
    const res = await Promise.allSettled(jobs);
    const ok = res.filter(r=>r.status==='fulfilled');
    if(!ok.length) throw new Error('all feeds failed');
    // extra days first, then today's live panel last so it always wins
    for(let i=res.length-1;i>=0;i--){ if(res[i].status==='fulfilled') parsePanel(res[i].value).forEach(m=>{ POOL[m.id]=m; }); }
    if(res.length>1) fullLoaded = true;
    rebuild();
    state.lastFetch = DATA.ts; state.offline = false;
    render();
    if(state.view==='match' && state.param && !DETAIL[state.param]) loadDetail(state.param);
  }catch(e){
    state.offline = true;
    if(!DATA) renderError(); else render();
  } finally { loading = false; }
}

/* ---------- news: ESPNcricinfo + BBC ---------- */
async function loadNews(){
  const items = [];
  const [a,b] = await Promise.allSettled([
    espn('/apis/site/v2/sports/cricket/'+NEWS_LEAGUE+'/news'),
    getJSON(BBC_RSS, 12000)
  ]);
  if(a.status==='fulfilled') (a.value.articles||[]).forEach(x=>{
    const link = ((x.links||{}).web||{}).href; if(!x.headline || !link) return;
    items.push({ title:strip(x.headline), desc:strip(x.description||''), link:link.replace(/^http:/,'https:'),
      date:x.published||x.lastModified, img:((x.images||[])[0]||{}).url||'', src:'ESPNcricinfo' });
  });
  if(b.status==='fulfilled' && b.value && b.value.status==='ok') (b.value.items||[]).forEach(x=>{
    if(!x.title || !x.link) return;
    items.push({ title:strip(x.title), desc:strip(x.description||''), link:x.link,
      date:(x.pubDate||'').replace(' ','T')+'Z', img:x.thumbnail || ((x.enclosure||{}).thumbnail) || '', src:'BBC Sport' });
  });
  if(!items.length){ if(!NEWS) NEWS = {items:[], failed:true}; render(); return; }
  const seen = new Set();
  const uniq = items.filter(n=>{ const k=n.title.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
  uniq.sort((x,y)=> (new Date(y.date)||0) - (new Date(x.date)||0));
  NEWS = { items: uniq.slice(0,40) };
  render();
}

async function loadDetail(id, silent){

function findMatch(id){ return POOL[id] || null; }

function buildInnings(sum){
  const hc = ((sum.header||{}).competitions||[])[0] || {};
  const comps = (hc.competitors||[]);
  const rosters = sum.rosters || [];
  const byTeam = {};
  rosters.forEach(r=>{ byTeam[String((r.team||{}).id)] = r; });
  const periods = [];
  comps.forEach(cp=>{
    const tid = String(cp.id || (cp.team||{}).id);
    (cp.linescores||[]).forEach(l=>{
      if(!l.isBatting) return;
      if(!(l.runs || l.wickets || +l.overs || l.isCurrent)) return;
      const st = statMap((((l.statistics||{}).categories||[])[0]||{}).stats);
      periods.push({ period:l.period, teamId:tid, teamName:dec(((cp.team||{}).displayName)||''), abr:((cp.team||{}).abbreviation)||'',
        runs:l.runs||0, wkts:l.wickets||0, overs:l.overs, cur:!!l.isCurrent, target:l.target||0, score:dec(l.score||''), desc:l.description||'', st });
    });
  });
  periods.sort((a,b)=>a.period-b.period);
  periods.forEach(p=>{
    const bat = byTeam[p.teamId], bowlT = rosters.find(r=>String((r.team||{}).id)!==p.teamId);
    p.batters = []; p.bowlers = [];
    if(bat) (bat.roster||[]).forEach(pl=>{
      const per = (pl.linescores||[]).find(x=>x.period===p.period); if(!per || !per.linescores || !per.linescores[0]) return;
      const L = per.linescores[0], S = L.statistics||{}, s = statMap(((S.categories||[])[0]||{}).stats);
      if(String(s.batted)!=='1') return;
      const od = (S.batting||{}).outDetails || {};
      const out = String(s.outs)==='1';
      p.batters.push({ order:+L.order||99, name:dec((pl.athlete||{}).battingName || (pl.athlete||{}).displayName || ''),
        dis: out ? strip(od.shortText || s.dismissalCard || '') : 'not out', out,
        onStrike: pl.activeName==='striker', atCrease: !out && p.cur && /striker/.test(pl.activeName||''),
        r:s.runs||'0', b:s.ballsFaced||'0', f:s.fours||'0', x:s.sixes||'0' });
    });
    if(bowlT) (bowlT.roster||[]).forEach(pl=>{
      const per = (pl.linescores||[]).find(x=>x.period===p.period); if(!per || !per.linescores || !per.linescores[0]) return;
      const s = statMap((((per.linescores[0].statistics||{}).categories||[])[0]||{}).stats);
      if(!s.overs || s.overs==='0' || s.overs==='0.0') return;
      p.bowlers.push({ pos:+s.bowlingPosition||99, name:dec((pl.athlete||{}).displayName||''), o:s.overs, m:s.maidens||'0', r:s.conceded||'0',
        w:s.wickets||'0', e:s.economyRate||'-', wd:s.wides||'0', nb:s.noballs||'0' });
    });
    p.batters.sort((a,b)=>a.order-b.order);
    p.bowlers.sort((a,b)=>a.pos-b.pos);
  });
  // fallback to matchcards (older matches without roster stats)
  if(!periods.some(p=>p.batters.length) && (sum.matchcards||[]).length){
    const map = {};
    sum.matchcards.forEach(mc=>{
      const k = mc.inningsNumber; map[k] = map[k] || { period:+k, teamName:'', batters:[], bowlers:[], st:{}, score:'' };
      if(mc.headline==='Batting'){ map[k].teamName = dec(mc.teamName); map[k].score = (mc.runs||'')+' '+(mc.total||'');
        (mc.playerDetails||[]).forEach((pd,i)=>map[k].batters.push({order:i, name:dec(pd.playerName), dis:strip(pd.dismissal), out:!/not out/i.test(pd.dismissal||''), r:pd.runs, b:pd.ballsFaced, f:pd.fours, x:pd.sixes})); }
      if(mc.headline==='Bowling') (mc.playerDetails||[]).forEach((pd,i)=>map[k].bowlers.push({pos:i, name:dec(pd.playerName), o:pd.overs, m:pd.maidens, r:pd.conceded, w:pd.wickets, e:pd.economyRate, wd:'-', nb:'-'}));
    });
    return Object.values(map).sort((a,b)=>a.period-b.period);
  }
  return periods;
}


/* ---- Hindi translation of live status lines (ESPN sends English) ---- */
function ST(txt){
  if(!txt || lang!=='hi') return txt;
  let s = String(txt);
  const tn = n => TN(n.trim());
  const R = [
    [/^(.+?) require (\d+) runs? with (\d+) wickets? and (\d+) balls? remaining$/i, (m,a,b,c,d)=>tn(a)+' को '+b+' रन चाहिए, '+c+' विकेट और '+d+' गेंद बाकी'],
    [/^(.+?) require (\d+) runs? from (\d+) balls?$/i, (m,a,b,c)=>tn(a)+' को '+c+' गेंदों में '+b+' रन चाहिए'],
    [/^(.+?) require (\d+) runs?(.*)$/i, (m,a,b,c)=>tn(a)+' को '+b+' रन चाहिए'+c],
    [/^(.+?) need (\d+) runs?(.*)$/i, (m,a,b,c)=>tn(a)+' को '+b+' रन चाहिए'+c],
    [/^(.+?) won by an inn?s (?:&|and) (\d+) runs?$/i, (m,a,b)=>tn(a)+' पारी और '+b+' रन से जीता'],
    [/^(.+?) won by (\d+) runs?(.*)$/i, (m,a,b,c)=>tn(a)+' '+b+' रन से जीता'+c],
    [/^(.+?) won by (\d+) wkts?(.*)$/i, (m,a,b,c)=>tn(a)+' '+b+' विकेट से जीता'+c],
    [/^(.+?) won by (\d+) wickets?(.*)$/i, (m,a,b,c)=>tn(a)+' '+b+' विकेट से जीता'+c],
    [/^(.+?) won the super over$/i, (m,a)=>tn(a)+' ने सुपर ओवर जीता'],
    [/^(.+?) lead by (\d+) runs?(.*)$/i, (m,a,b,c)=>tn(a)+' '+b+' रन से आगे'+c],
    [/^(.+?) trail by (\d+) runs?(.*)$/i, (m,a,b,c)=>tn(a)+' '+b+' रन से पीछे'+c],
    [/^(.+?) won (?:the )?toss (?:&|and) (?:elected to )?bat(?:ted)?(?: first)?$/i, (m,a)=>tn(a)+' ने टॉस जीतकर बल्लेबाज़ी चुनी'],
    [/^(.+?) won (?:the )?toss (?:&|and) (?:elected to )?field(?:ed)?(?: first)?$/i, (m,a)=>tn(a)+' ने टॉस जीतकर गेंदबाज़ी चुनी'],
    [/^(.+?) won (?:the )?toss$/i, (m,a)=>tn(a)+' ने टॉस जीता'],
    [/^(.+?)\s*,\s*elected to bat first$/i, (m,a)=>tn(a)+' ने पहले बल्लेबाज़ी चुनी'],
    [/^(.+?)\s*,\s*elected to field first$/i, (m,a)=>tn(a)+' ने पहले गेंदबाज़ी चुनी'],
    [/^starts at (\d{1,2}:\d{2}) local time$/i, (m,a)=>'स्थानीय समय '+a+' पर शुरू'],
    [/^match drawn$/i, ()=>'मैच ड्रॉ'], [/^match tied$/i, ()=>'मैच टाई'], [/^no result$/i, ()=>'कोई परिणाम नहीं'],
    [/^match abandoned.*$/i, ()=>'मैच रद्द'], [/^stumps$/i, ()=>'दिन का खेल खत्म'], [/^lunch$/i, ()=>'लंच'], [/^tea$/i, ()=>'टी ब्रेक'],
    [/^innings break$/i, ()=>'पारी ब्रेक'], [/^rain delay$|^rain$/i, ()=>'बारिश से रुका'], [/^result$/i, ()=>'परिणाम'], [/^live$/i, ()=>'लाइव'], [/^scheduled$/i, ()=>'निर्धारित']
  ];
  for(const [re,fnc] of R){ if(re.test(s)) return s.replace(re, fnc); }
  return s;
}

    if(new Date(m.start) < new Date(s.start)) s.start = m.start;
  });
  return Object.values(map).sort((a,b)=> (b.live-a.live) || a.name.localeCompare(b.name));
}
function renderSeries(){
  if(!DATA) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  const list = seriesList();
  let html = '<div class="pgtitle">'+t('seriesTitle')+'</div>';
  if(!list.length) return html+'<div class="p-card"><p>'+t('empty')+'</p></div>';
  html += '<div class="cards2">' + list.map(s=>
    '<div class="p-card click" onclick="go(\'seriesView\',\''+esc(s.id)+'\')"><h3>'+esc(s.name)+'</h3>'
    + '<div style="margin-bottom:10px">'+(s.live? '<span class="badge"><span class="dot"></span>'+tf('liveN',{n:s.live})+'</span>':'<span class="badge green">'+tf('matchesN',{n:s.total})+'</span>')+'</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">🏏 '+esc([...s.types].join(', ')||'—')+'</div>'
    + '<div style="font-size:13px;color:var(--muted)">'+tf('matchesN',{n:s.total})+'</div></div>'
  ).join('') + '</div>';
  return html;
}
function renderSeriesView(lid){
  if(!DATA) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  const ms = [...DATA.live, ...DATA.upcoming, ...DATA.recent].filter(m=>m.league===lid);
  let html = '<span class="back" onclick="go(\'series\')">← '+t('navSeries')+'</span>';
  html += '<div class="pgtitle">🏏 '+esc(ms[0]? ms[0].series : '')+'</div>';
  if(!ms.length) return html+'<div class="p-card"><p>'+t('empty')+'</p></div>';
  return html + '<div style="border-top:1px solid var(--border);border-radius:10px;overflow:hidden">'+ms.map(matchCard).join('')+'</div>';
}

function renderAbout(){
  return '<div class="pgtitle">'+t('aboutTitle')+'</div>'
    + '<div class="p-card"><div class="art-body" style="font-size:14.5px;line-height:1.8">'
    + '<p style="margin-bottom:12px">'+t('aboutA')+'</p>'
    + '<p style="margin-bottom:12px">'+t('aboutB')+'</p>'
    + '<div class="chips"><span class="src-badge">✅ '+t('dataSrc')+'</span><span class="src-badge">'+t('refreshInfo')+'</span></div>'
    + '</div></div>';
}

function renderAside(){
  if(!DATA) return '';
  const live = DATA.live.slice(0,6);
  let html = '<div class="side-card"><div class="side-h">'+t('liveNow')+'<a onclick="setTab(\'live\');go(\'matches\')">'+t('more')+'</a></div>';
  html += live.length? live.map(m=>
    '<div class="mini-match" onclick="go(\'match\',\''+esc(m.id)+'\')"><b>'+esc(m.t1.abr||TN(m.t1.name))+' '+esc(m.t1.score||'—')+' • '+esc(m.t2.abr||TN(m.t2.name))+' '+esc(m.t2.score||'—')+'</b><small>'+esc(ST(m.statusText)||m.series)+'</small></div>'
  ).join('') : '<small style="color:var(--muted)">'+t('empty')+'</small>';
  html += '</div>';
  html += '<div class="side-card"><div class="side-h">'+t('latestNews')+'<a onclick="go(\'news\')">'+t('more')+'</a></div>';
  if(NEWS && NEWS.items.length){
    html += NEWS.items.slice(0,5).map(n=>'<a class="news-item" href="'+esc(n.link)+'" target="_blank" rel="noopener">'+newsThumb(n)+'<div><h4>'+esc(n.title)+'</h4><small>'+esc(n.src)+'</small></div></a>').join('');
  } else if(!NEWS){ html += '<div class="spin"></div>'; }
  html += '</div>';
  return html;
}

let errTimer = null;
function renderError(){
  $('main').innerHTML = '<div class="err-box">'
    + '<div style="font-size:44px;margin-bottom:10px">📡</div>'
    + '<h3>'+t('errTitle')+'</h3>'
    + '<p style="margin-bottom:14px">'+t('errText')+'</p>'
    + '<div style="background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;text-align:left;margin-bottom:16px">'
    + '📶 <b>'+t('errStep1')+'</b><br>🛡️ <b>'+t('errStep2')+'</b></div>'
    + '<button onclick="loadMatches(true)" style="background:var(--accent);color:#fff;border:none;border-radius:22px;padding:11px 26px;font-size:14.5px;font-weight:700;cursor:pointer">🔄 '+t('retry')+'</button>'
    + '</div>';
  clearTimeout(errTimer);
  errTimer = setTimeout(()=>{ if(!DATA) loadMatches(true); }, 8000);
}

/* ============================================================
   SEARCH (real matches + real news)
============================================================ */
function doSearch(q){
  const box = $('sres');
  if(!q || q.trim().length<2){ box.classList.remove('show'); return; }
  q = q.toLowerCase().trim();
  const hits = [];
  if(DATA) [...DATA.live,...DATA.upcoming,...DATA.recent].forEach(m=>{
    const hay = (m.t1.name+' '+m.t2.name+' '+TN(m.t1.name)+' '+TN(m.t2.name)+' '+m.t1.abr+' '+m.t2.abr+' '+m.series+' '+m.round+' '+m.type+' '+m.venue).toLowerCase();
    if(hay.includes(q)) hits.push({label:'🏏 '+TN(m.t1.name)+' vs '+TN(m.t2.name), sub:(m.tab==='live'?'🔴 ':'')+(m.round||m.type), act:()=>go('match',m.id)});
  });
  if(NEWS) NEWS.items.forEach(n=>{
    if(n.title.toLowerCase().includes(q)) hits.push({label:'📰 '+n.title, sub:n.src, act:()=>window.open(n.link,'_blank','noopener')});
  });
  const seen = new Set(); const uniq = hits.filter(h=>{ const k=h.label; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,10);
  box.innerHTML = uniq.length? uniq.map((h,i)=>'<div class="sres-item" data-i="'+i+'">'+esc(h.label)+'<small>'+esc(h.sub)+'</small></div>').join('') : '<div class="sres-item">🤷</div>';
  box.classList.add('show');
  uniq.forEach((h,i)=>{ box.querySelector('[data-i="'+i+'"]').onclick = ()=>{ h.act(); box.classList.remove('show'); $('searchBox').value=''; }; });
}

/* ============================================================
   ROUTER (hash based → browser Back button works) + RENDER
============================================================ */
function go(view, param){
  const h = '#/'+view+(param!==undefined && param!==null ? '/'+encodeURIComponent(param) : '');
  if(location.hash !== h) location.hash = h; else route();
}
function route(){
  const parts = (location.hash||'').replace(/^#\/?/,'').split('/');
  const v = parts[0] || 'matches';
  const valid = ['matches','match','news','series','seriesView','about'];
  state.view = valid.includes(v) ? v : 'matches';
  state.param = parts[1] ? decodeURIComponent(parts[1]) : null;
  if(state.view==='match' && state.param) loadDetail(state.param);
  render(); window.scrollTo(0,0);
}
function setLang(c){ lang=c; try{ localStorage.setItem('cp_lang',c); }catch(e){} applyI18n(); render(); }
function toggleTheme(){
  document.body.classList.toggle('dark');
  const dark = document.body.classList.contains('dark');
  document.querySelector('.theme-btn').textContent = dark?'☀️':'🌙';
  try{ localStorage.setItem('cp_theme', dark?'dark':'light'); }catch(e){}
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  $('searchBox').placeholder = t('searchPh');
  document.title = t('docTitle');
  document.documentElement.lang = lang;
}
const ROUTE_MAP = {home:'matches', live:'matches', news:'news', series:'series', about:'about'};
function render(){
  const active = state.view==='match' ? 'matches' : state.view==='seriesView' ? 'series' : state.view;
  document.querySelectorAll('.navwrap a').forEach(a=>{
    a.textContent = t({home:'navHome',live:'navLive',news:'navNews',series:'navSeries',about:'navAbout'}[a.dataset.route]);
    a.classList.toggle('active', a.dataset.route!=='home' && ROUTE_MAP[a.dataset.route]===active);
  });
  const wide = state.view==='match';
  $('layout').classList.toggle('wide', wide);
  let main='';
  try{
    if(state.view==='matches') main = renderMatches();
    else if(state.view==='match') main = renderMatchDetail(state.param);
    else if(state.view==='news') main = renderNewsList();
    else if(state.view==='series') main = renderSeries();
    else if(state.view==='seriesView') main = renderSeriesView(state.param);
    else if(state.view==='about') main = renderAbout();
  }catch(e){ console.error(e); main = '<div class="err-box"><p>⚠️ '+esc(e.message)+'</p></div>'; }
  if(!DATA && state.offline && (state.view==='matches'||state.view==='match'||state.view==='series'||state.view==='seriesView')) { renderError(); }
  else $('main').innerHTML = main;
  if(!wide) $('aside').innerHTML = renderAside();
}

/* ============================================================
   INIT — real polling every 15s
============================================================ */
(function init(){
  try{ if(localStorage.getItem('cp_theme')==='dark'){ document.body.classList.add('dark'); document.querySelector('.theme-btn').textContent='☀️'; } }catch(e){}
  $('langSel').innerHTML = LANGS.map(l=>'<option value="'+l.c+'"'+(l.c===lang?' selected':'')+'>'+l.label+'</option>').join('');
  $('searchBox').addEventListener('input', e=>doSearch(e.target.value));
  document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('sres').classList.remove('show'); });
  window.addEventListener('hashchange', route);
  document.querySelectorAll('.navwrap a').forEach(a=>{ a.setAttribute('href','javascript:void(0)'); });
  applyI18n();
  route();
  loadMatches();
  loadNews();
  setInterval(()=>{ if(!document.hidden) loadMatches(); }, 15000);                 // live refresh (today's panel)
  setInterval(()=>{ if(!document.hidden) loadMatches(true); }, 5*60000);           // full refresh (yesterday/tomorrow)
  setInterval(()=>{ if(!document.hidden && state.view==='match' && state.param){ const m=findMatch(state.param); if(m && m.live) loadDetail(state.param, true); } }, 20000);
  setInterval(()=>loadNews(), 10*60000);
  setInterval(()=>{ const el=$('agoTxt'); if(el && state.lastFetch) el.textContent = agoStr(state.lastFetch); }, 1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadMatches(); });
})();

</script>
