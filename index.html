<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricPulse — Live Cricket Score</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Bengali', 'Noto Sans Tamil', Arial, sans-serif; }
  :root { --nav:#0b3160; --nav2:#0d3c75; --accent:#0d5ea8; --live:#e63946; --bg:#f4f6f9; --card:#fff; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; --green:#16a34a; }
  body.dark { --bg:#0b1220; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8; --border:#23304d; --nav:#081428; --nav2:#0c1e3c; }
  body { background:var(--bg); color:var(--text); transition:background .3s,color .3s; }

  header { background:linear-gradient(135deg,var(--nav),var(--nav2)); color:#fff; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .hwrap { max-width:1200px; margin:auto; display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .logo { font-size:23px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .logo .ball { width:28px; height:28px; background:radial-gradient(circle at 30% 30%, #ff6b6b, #c1121f 70%); border-radius:50%; position:relative; animation:spin 6s linear infinite; }
  .logo .ball::after { content:''; position:absolute; inset:0; border-radius:50%; border-left:2px solid rgba(255,255,255,.7); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .logo span.red { color:#ff6b6b; }
  .search { flex:1; max-width:380px; margin-left:auto; position:relative; }
  .search input { width:100%; padding:9px 14px 9px 36px; border-radius:20px; border:none; outline:none; background:rgba(255,255,255,.14); color:#fff; font-size:14px; }
  .search input::placeholder { color:rgba(255,255,255,.65); }
  .search::before { content:'🔍'; position:absolute; left:11px; top:9px; font-size:14px; z-index:2; }
  .sres { position:absolute; top:42px; left:0; right:0; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:none; box-shadow:0 10px 30px rgba(0,0,0,.3); max-height:320px; overflow-y:auto; z-index:60; }
  .sres.show { display:block; }
  .sres-item { padding:9px 13px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sres-item:last-child { border-bottom:none; }
  .sres-item:hover { background:var(--bg); }
  .sres-item small { color:var(--muted); margin-left:auto; }
  .langsel { background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:20px; padding:9px 8px; font-size:13.5px; cursor:pointer; outline:none; max-width:128px; }
  .langsel option { color:#1a1a2e; }
  .theme-btn { background:rgba(255,255,255,.14); border:none; color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:16px; flex-shrink:0; }
  nav { background:rgba(0,0,0,.18); }
  .navwrap { max-width:1200px; margin:auto; display:flex; gap:2px; padding:0 10px; overflow-x:auto; }
  .navwrap a { color:#dbe7f5; text-decoration:none; padding:10px 13px; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
  .navwrap a.active, .navwrap a:hover { color:#fff; border-bottom-color:#ff6b6b; }

  .layout { max-width:1200px; margin:auto; display:grid; grid-template-columns:1fr 330px; gap:18px; padding:18px 16px; }
  .layout.wide { grid-template-columns:1fr; }
  .layout.wide aside { display:none; }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

  .tabs { display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:10px 10px 0 0; padding:6px 6px 0; }
  .tab { flex:1; text-align:center; padding:10px; font-weight:700; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  body.dark .tab.active { color:#6cb6ff; border-bottom-color:#6cb6ff; }

  .pgtitle { font-size:22px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pgtitle small { font-size:12px; color:var(--muted); font-weight:600; }

  .match-card { background:var(--card); border:1px solid var(--border); border-top:none; padding:14px 16px; cursor:pointer; transition:.2s; }
  .match-card:last-of-type { border-radius:0 0 10px 10px; }
  .match-card:hover { box-shadow:0 4px 16px rgba(13,94,168,.15); }
  .m-head { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .badge { background:var(--live); color:#fff; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .badge .dot { width:7px; height:7px; background:#fff; border-radius:50%; animation:pulse 1s infinite; }
  @keyframes pulse { 50%{ opacity:.25; } }
  .badge.green { background:var(--green); }
  .badge.gray { background:#8a94a6; }
  .m-teams { display:flex; flex-direction:column; gap:8px; }
  .t-row { display:flex; align-items:center; gap:10px; }
  .t-abbr { min-width:44px; font-size:11px; font-weight:800; color:var(--muted); background:var(--bg); border-radius:6px; padding:4px 6px; text-align:center; }
  .t-name { font-weight:700; flex:1; font-size:15px; }
  .t-score { font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .t-score.dim { color:var(--muted); font-weight:600; font-size:13px; }
  .t-row.batting .t-name::after { content:'•'; color:var(--live); margin-left:6px; animation:pulse 1s infinite; }
  .m-foot { margin-top:10px; padding-top:9px; border-top:1px dashed var(--border); font-size:13px; color:var(--accent); font-weight:600; }
  body.dark .m-foot { color:#6cb6ff; }
  .empty { padding:26px; text-align:center; color:var(--muted); background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; font-size:14px; }
  .refresh-bar { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-bottom:none; border-radius:10px 10px 0 0; padding:8px 14px; font-size:12px; color:var(--muted); }
  .refresh-bar b { color:var(--green); }

  .back { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px; margin-bottom:12px; cursor:pointer; font-weight:700; color:var(--accent); display:inline-block; }
  body.dark .back { color:#6cb6ff; }
  .d-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .d-title { font-size:19px; font-weight:800; margin-bottom:4px; line-height:1.4; }
  .d-sub { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .stats-row { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { flex:1; min-width:110px; background:var(--bg); border-radius:8px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:19px; color:var(--accent); }
  body.dark .stat b { color:#6cb6ff; }
  .stat span { font-size:11px; color:var(--muted); }
  .status-line { background:rgba(22,163,74,.1); border-left:4px solid var(--green); padding:10px 14px; border-radius:6px; font-size:14px; font-weight:600; margin-top:10px; }
  .section-h { font-weight:800; font-size:14px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); }
  body.dark .section-h { color:#6cb6ff; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:600; }

  .side-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .side-h { font-weight:800; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .side-h a { font-size:12px; color:var(--accent); text-decoration:none; font-weight:600; cursor:pointer; white-space:nowrap; }
  body.dark .side-h a { color:#6cb6ff; }
  .mini-match { padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; }
  .mini-match:last-child { border-bottom:none; }
  .mini-match b { display:block; margin-bottom:3px; }
  .mini-match small { color:var(--muted); }
  .news-item { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .news-item:last-child { border-bottom:none; }
  .news-thumb { width:64px; height:48px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:linear-gradient(135deg,#1c78d2,#0b3160); }
  .news-item h4 { font-size:12.5px; line-height:1.45; font-weight:600; }
  .news-item small { color:var(--muted); font-size:11px; }

  .cards2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
  .p-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .p-card h3 { font-size:15.5px; font-weight:800; margin-bottom:8px; line-height:1.5; }
  .p-card p { font-size:13px; color:var(--muted); line-height:1.6; }
  .news-big { display:flex; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; cursor:pointer; transition:.2s; }
  .news-big:hover { box-shadow:0 4px 16px rgba(13,94,168,.15); }
  .news-big .news-thumb { width:100px; height:76px; font-size:30px; }
  .news-big h3 { font-size:15px; font-weight:700; line-height:1.45; margin-bottom:6px; }
  .news-big p { font-size:13px; color:var(--muted); line-height:1.5; }
  .news-big .meta { font-size:11.5px; color:var(--accent); font-weight:600; margin-top:6px; }
  body.dark .news-big .meta { color:#6cb6ff; }
  .src-badge { display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); padding:5px 11px; border-radius:8px; font-size:12px; font-weight:700; color:var(--muted); }
  .err-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:30px 20px; text-align:center; }
  .err-box h3 { margin-bottom:8px; font-size:16px; }
  .err-box p { color:var(--muted); font-size:13.5px; line-height:1.6; }
  .spin { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; margin:0 auto 12px; }
  @keyframes rot { to { transform:rotate(360deg); } }
  footer { background:var(--nav); color:#9fb6d4; margin-top:26px; padding:22px 16px; text-align:center; font-size:13px; line-height:1.8; }
</style>
</head>

let lang = 'en';
try { const s = localStorage.getItem('cp_lang'); if(s && I18N[s]) lang = s; else if((navigator.language||'').toLowerCase().startsWith('hi')) lang='hi'; } catch(e){}
function t(k){ const d=I18N[lang]||I18N.en; return d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k); }
function tf(k,p){ let s=t(k); for(const x in p){ s=s.split('{'+x+'}').join(p[x]); } return s; }
function TN(n){ const m=TEAM_I18N[lang]; return (m&&m[n])||n; }

/* ============================================================
   REAL DATA — fetch from OUR backend (which fetches real APIs)
============================================================ */
let DATA = null;      // {live, upcoming, recent, ts}
let NEWS = null;      // {items}
let SERIES = null;
let state = { view:'matches', tab:'live', param:null, lastFetch:null };

async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error('api '+r.status);
  return r.json();
}
async function loadMatches(force){
  try{
    if(!force && DATA && Date.now()-DATA.ts < 10000) return;
    DATA = await api('/api/matches');
    state.lastFetch = DATA.ts;
    render();
  }catch(e){ renderError(); }
}
async function loadNews(){ try{ NEWS = await api('/api/news'); render(); }catch(e){} }
async function loadSeries(){ try{ SERIES = await api('/api/series'); render(); }catch(e){} }

/* ============================================================
   RENDER HELPERS
============================================================ */
const $ = id => document.getElementById(id);
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtScore(inn){ if(!inn||!inn.length) return ''; return inn.map(i=> i.runs + '/' + (i.wkts!==undefined?i.wkts:0) + (i.overs?' ('+i.overs+')':'')).join(' & '); }
function startStr(s){
  if(!s||s.length<12) return '';
  const p = {y:+s.slice(0,4), mo:+s.slice(4,6)-1, d:+s.slice(6,8), h:+s.slice(8,10), mi:+s.slice(10,12)};
  const dt = new Date(p.y,p.mo,p.d,p.h,p.mi);
  try { return dt.toLocaleString(lang==='en'?'en-GB':lang, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return s.slice(0,8)+' '+p.h+':'+String(p.mi).padStart(2,'0'); }
}
function agoStr(ts){
  const n = Math.max(0, Math.round((Date.now()-ts)/1000));
  return n<5 ? t('justNow') : tf('secAgo',{n});
}
function battingSide(m){
  if(!m.live) return null;
  // the side batting = the one whose innings has fewer completed innings / latest innings present
  const i1=m.innings1.length, i2=m.innings2.length;
  if(i2>0) return 't2'; if(i1>0) return 't1'; return null;
}
function innRows(m){
  const rows=[];
  m.innings1.forEach((i,ix)=>rows.push({side:'t1', inn:i, label:m.innings1.length>1? (ix+1) : null}));
  m.innings2.forEach((i,ix)=>rows.push({side:'t2', inn:i, label:m.innings2.length>1? (ix+1) : null}));
  return rows;
}

function matchCard(m){
  const bt = battingSide(m);
  let badge, teams='', foot='';
  const head = esc(m.round? m.round+' • ':'') + esc(m.seriesDetail||m.series) ;
  if(m.tab==='live'){
    badge = '<span class="badge"><span class="dot"></span>'+t('badgeLive')+'</span>';
  } else if(m.tab==='upcoming'){
    badge = '<span class="badge green">'+t('badgeUp')+'</span>';
    foot = '🕐 '+startStr(m.start);
  } else {
    badge = '<span class="badge gray">'+t('badgeRes')+'</span>';
  }
  // team rows with real innings scores
  const rows = {t1:[], t2:[]};
  innRows(m).forEach(r=>{
    const s = r.inn.runs + '/' + (r.inn.wkts!==undefined?r.inn.wkts:0);
    rows[r.side].push(r.inn.overs? s+' ('+r.inn.overs+')' : s);
  });
  const mk = (side, team, other) => {
    const sc = rows[side].length? '<span class="t-score">'+rows[side].join(' & ')+'</span>'
      : (m.tab==='upcoming'? '<span class="t-score dim">—</span>' : '<span class="t-score dim">&nbsp;</span>');
    return '<div class="t-row '+(bt===side?'batting':'')+'"><span class="t-abbr">'+esc(team.abr||team.name.slice(0,3).toUpperCase())+'</span><span class="t-name">'+esc(TN(team.name))+'</span>'+sc+'</div>';
  };
  teams = mk('t1', m.t1) + mk('t2', m.t2);
  if(m.tab==='live' && m.statusText) foot = '📊 '+esc(m.statusText);
  if(m.tab==='recent' && m.statusText) foot = '🏁 '+esc(m.statusText);
  return '<div class="match-card" onclick="go(\'match\',\''+m.id+'\')">'
    + '<div class="m-head"><span>'+head+'</span>'+badge+'</div>'
    + '<div class="m-teams">'+teams+'</div><div class="m-foot">'+foot+'</div></div>';
}

function renderMatches(){
  if(!DATA) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  const items = DATA[state.tab]||[];
  let html = '<div class="refresh-bar"><span>'+t('refreshInfo')+'</span>'
    + '<span>'+(state.lastFetch? (t('updated')+' • '+agoStr(state.lastFetch)):'')+' <b style="cursor:pointer" onclick="loadMatches(true)">⟳</b></span></div>';
  html += '<div class="tabs">'
    + '<div class="tab '+(state.tab==='live'?'active':'')+'" onclick="setTab(\'live\')">'+t('tabLive')+' ('+DATA.live.length+')</div>'
    + '<div class="tab '+(state.tab==='upcoming'?'active':'')+'" onclick="setTab(\'upcoming\')">'+t('tabUp')+' ('+DATA.upcoming.length+')</div>'
    + '<div class="tab '+(state.tab==='recent'?'active':'')+'" onclick="setTab(\'recent\')">'+t('tabRec')+' ('+DATA.recent.length+')</div></div>';
  html += items.length? items.map(matchCard).join('') : '<div class="empty">'+t('empty')+'</div>';
  return html;
}
function setTab(tb){ state.tab=tb; render(); }

function renderMatchDetail(id){
  if(!DATA) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  const m = [...DATA.live,...DATA.upcoming,...DATA.recent].find(x=>x.id===id);
  if(!m) return '<span class="back" onclick="go(\'matches\')">'+t('back')+'</span><div class="err-box"><p>'+t('empty')+'</p></div>';
  let html = '<span class="back" onclick="go(\'matches\')">'+t('back')+'</span>';
  html += '<div class="d-card"><div class="d-title">'+esc(TN(m.t1.name))+' vs '+esc(TN(m.t2.name))+'</div>'
    + '<div class="d-sub">'+esc(m.round)+' • '+esc(m.series)+' • '+esc(m.type)+'</div>';
  const inn = innRows(m);
  const sum = side => inn.filter(r=>r.side===side).reduce((a,r)=>a+r.inn.runs,0);
  html += '<div class="stats-row">'
    + '<div class="stat"><b>'+sum('t1')+'</b><span>'+t('stRuns')+' — '+esc(m.t1.abr||'')+'</span></div>'
    + '<div class="stat"><b>'+sum('t2')+'</b><span>'+t('stRuns')+' — '+esc(m.t2.abr||'')+'</span></div>'
    + '<div class="stat"><b>'+esc(m.statusLabel||'—')+'</b><span>'+t('status')+'</span></div>'
    + '</div>';
  if(m.statusText) html += '<div class="status-line">📊 '+esc(m.statusText)+'</div>';
  if(m.start) html += '<div class="chips"><span class="chip">'+t('startT')+': '+startStr(m.start)+'</span><span class="chip">'+t('type')+': '+esc(m.type)+'</span></div>';
  html += '</div>';
  html += '<div class="d-card"><div class="section-h">'+t('series')+'</div><div style="font-size:14.5px;font-weight:600">'+esc(m.series)+'</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-top:4px">'+esc(m.seriesDetail)+'</div>';
  const allInn = inn;
  if(allInn.length){
    html += '<div class="section-h">🏏 '+t('stRuns')+'</div>';
    allInn.forEach(r=>{
      const nm = r.side==='t1'? TN(m.t1.name) : TN(m.t2.name);
      const lbl = r.label? ' — '+r.label : '';
      html += '<div class="status-line" style="background:var(--bg);border-left-color:var(--accent);margin-bottom:8px">'
        + '<b>'+esc(nm)+lbl+'</b><br>'+r.inn.runs+' / '+ (r.inn.wkts!==undefined?r.inn.wkts:0)
        + (r.inn.overs? ' &nbsp;('+r.inn.overs+' '+t('stOvers')+')':'') + '</div>';
    });
  }
  if(m.tv && m.tv.length){
    html += '<div class="section-h">'+t('tvOn')+'</div><div class="chips">' + m.tv.map(x=>'<span class="chip">📺 '+esc(x)+'</span>').join('') + '</div>';
  }
  html += '</div>';
  return html;
}

function renderNewsList(){
  if(!NEWS) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  let html = '<div class="pgtitle">'+t('newsTitle')+'</div>';
  if(!NEWS.items.length) return html+'<div class="p-card"><p>'+t('empty')+'</p></div>';
  html += NEWS.items.map(n=>{
    let d=''; try{ d = new Date(n.date).toLocaleString(lang==='en'?'en-GB':lang,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){}
    return '<div class="news-big" onclick="window.open(\''+esc(n.link)+'\',\'_blank\')">'
      + '<div class="news-thumb">📰</div><div><h3>'+esc(n.title)+'</h3><p>'+esc(n.desc)+'</p>'
      + '<div class="meta">'+esc(d)+' • BBC Sport</div></div></div>';
  }).join('');
  return html + '<div class="p-card" style="text-align:center"><span class="src-badge">✅ '+t('readOn')+'</span></div>';
}

function renderSeries(){
  if(!SERIES) return '<div class="err-box"><div class="spin"></div><h3>'+t('loading')+'</h3></div>';
  let html = '<div class="pgtitle">'+t('seriesTitle')+'</div><div class="cards2">';
  html += SERIES.series.map(s=>
    '<div class="p-card"><h3>'+esc(s.name)+'</h3>'
    + '<div style="margin-bottom:10px">'+(s.live? '<span class="badge"><span class="dot"></span>'+tf('liveN',{n:s.live})+'</span>':'<span class="badge green">'+t('badgeUp')+'</span>')+'</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">🏏 '+esc(s.detail||'')+'</div>'
    + '<div style="font-size:13px;color:var(--muted)">'+tf('matchesN',{n:s.total})+'</div></div>'
  ).join('');
  return html+'</div>';
}

function renderAbout(){
  return '<div class="pgtitle">'+t('aboutTitle')+'</div>'
    + '<div class="p-card"><div class="art-body" style="font-size:14.5px;line-height:1.8">'
    + '<p style="margin-bottom:12px">'+t('aboutA')+'</p>'
    + '<p style="margin-bottom:12px">'+t('aboutB')+'</p>'
    + '<div class="chips"><span class="src-badge">✅ '+t('dataSrc')+'</span><span class="src-badge">'+t('refreshInfo')+'</span></div>'
    + '</div></div>';
}

function renderAside(){
  if(!DATA) return '';
  const live = DATA.live.slice(0,5);
  let html = '<div class="side-card"><div class="side-h">'+t('liveNow')+'<a onclick="setTab(\'live\');go(\'matches\')">'+t('more')+'</a></div>';
  html += live.length? live.map(m=>{
    const i1 = m.innings1[0], i2 = m.innings2[0];
    const s1 = i1? i1.runs+'/'+(i1.wkts!==undefined?i1.wkts:0) : '—';
    const s2 = i2? i2.runs+'/'+(i2.wkts!==undefined?i2.wkts:0) : '—';
    return '<div class="mini-match" onclick="go(\'match\',\''+m.id+'\')"><b>'+esc(TN(m.t1.name))+' '+s1+' — '+esc(TN(m.t2.name))+' '+s2+'</b><small>'+esc(m.statusText||m.series)+'</small></div>';
  }).join('') : '<small style="color:var(--muted)">'+t('empty')+'</small>';
  html += '</div>';
  // news
  html += '<div class="side-card"><div class="side-h">'+t('latestNews')+'<a onclick="go(\'news\')">'+t('more')+'</a></div>';
  if(NEWS && NEWS.items.length){
    html += NEWS.items.slice(0,4).map(n=>'<div class="news-item" onclick="window.open(\''+esc(n.link)+'\',\'_blank\')"><div class="news-thumb">📰</div><div><h4>'+esc(n.title)+'</h4><small>BBC Sport</small></div></div>').join('');
  }
  html += '</div>';
  return html;
}

function renderError(){
  $('main').innerHTML = '<div class="err-box">'
    + '<div style="font-size:44px;margin-bottom:10px">📡</div>'
    + '<h3>'+t('errTitle')+'</h3>'
    + '<p style="margin-bottom:14px">'+t('errText')+'</p>'
    + '<div style="background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;text-align:left;margin-bottom:16px">'
    + '📱 <b>'+t('errStep1')+'</b><br>🖱️ <b>'+t('errStep2')+'</b></div>'
    + '<button onclick="loadMatches(true)" style="background:var(--accent);color:#fff;border:none;border-radius:22px;padding:11px 26px;font-size:14.5px;font-weight:700;cursor:pointer">🔄 '+t('retry')+'</button>'
    + '</div>';
  setTimeout(()=>{ if(!DATA) loadMatches(true); }, 6000);
}

/* ============================================================
   SEARCH (real matches + real news)
============================================================ */
function doSearch(q){
  const box = $('sres');
  if(!q || q.trim().length<2){ box.classList.remove('show'); return; }
  q = q.toLowerCase();
  const hits = [];
  if(DATA) [...DATA.live,...DATA.upcoming,...DATA.recent].forEach(m=>{
    const hay = (m.t1.name+' '+m.t2.name+' '+m.series+' '+m.round+' '+m.type).toLowerCase();
    if(hay.includes(q)) hits.push({label:'🏏 '+TN(m.t1.name)+' vs '+TN(m.t2.name), sub:m.round||m.type, act:()=>go('match',m.id)});
  });
  if(NEWS) NEWS.items.forEach(n=>{
    if(n.title.toLowerCase().includes(q)) hits.push({label:'📰 '+n.title, sub:'BBC', act:()=>window.open(n.link,'_blank')});
  });
  const seen = new Set(); const uniq = hits.filter(h=>{ const k=h.label; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,8);
  box.innerHTML = uniq.length? uniq.map((h,i)=>'<div class="sres-item" data-i="'+i+'">'+esc(h.label)+'<small>'+esc(h.sub)+'</small></div>').join('') : '<div class="sres-item">🤷</div>';
  box.classList.add('show');
  uniq.forEach((h,i)=>{ box.querySelector('[data-i="'+i+'"]').onclick = ()=>{ h.act(); box.classList.remove('show'); $('searchBox').value=''; }; });
}

/* ============================================================
   ROUTER + RENDER
============================================================ */
function go(view, param){ state.view=view; state.param=(param!==undefined?param:null); render(); window.scrollTo(0,0); }
function setLang(c){ lang=c; try{ localStorage.setItem('cp_lang',c); }catch(e){} applyI18n(); render(); }
function toggleTheme(){ document.body.classList.toggle('dark'); document.querySelector('.theme-btn').textContent = document.body.classList.contains('dark')?'☀️':'🌙'; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  $('searchBox').placeholder = t('searchPh');
  document.title = t('docTitle');
  document.documentElement.lang = lang;
}
const ROUTE_MAP = {home:'matches', live:'matches', news:'news', series:'series', about:'about'};
function render(){
  const active = state.view==='match' ? 'live' : state.view;
  document.querySelectorAll('.navwrap a').forEach(a=>{
    a.textContent = t({home:'navHome',live:'navLive',news:'navNews',series:'navSeries',about:'navAbout'}[a.dataset.route]);
    a.classList.toggle('active', ROUTE_MAP[a.dataset.route]===active);
  });
  const wide = state.view==='match';
  $('layout').classList.toggle('wide', wide);
  let main='';
  if(state.view==='matches') main = renderMatches();
  else if(state.view==='match') main = renderMatchDetail(state.param);
  else if(state.view==='news') main = renderNewsList();
  else if(state.view==='series') main = renderSeries();
  else if(state.view==='about') main = renderAbout();
  $('main').innerHTML = main;
  if(!wide) $('aside').innerHTML = renderAside();
}

/* ============================================================
   INIT — real polling every 15s
============================================================ */
(function init(){
  $('langSel').innerHTML = LANGS.map(l=>'<option value="'+l.c+'"'+(l.c===lang?' selected':'')+'>'+l.label+'</option>').join('');
  $('searchBox').addEventListener('input', e=>doSearch(e.target.value));
  document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('sres').classList.remove('show'); });
  applyI18n();
  loadMatches();
  loadNews();
  setInterval(()=>loadMatches(true), 15000);      // real live refresh
  setInterval(()=>loadNews(), 600000);
})();
